<!--
  剧桥 / ScriptBridge — Nav Mark (dark mode, ~36px)
  深色底板，S 双色带设计与亮色版一致
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bgD" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1e2d3e"/>
      <stop offset="55%"  stop-color="#162236"/>
      <stop offset="100%" stop-color="#0f1a2a"/>
    </linearGradient>
  </defs>

  <!-- 深色底板 -->
  <rect width="40" height="40" rx="10" fill="url(#bgD)"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25"
        stroke="rgba(255,255,255,0.12)" fill="none" stroke-width="1"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25"
        stroke="rgba(220,80,60,0.22)" fill="none" stroke-width="1"/>

  <!-- S 下段色带：墨绿（深色背景略亮） -->
  <path d="M 20 20.5 C 33 24 29 31.5 12 32"
        stroke="#3a8060" stroke-width="7.5"
        stroke-linecap="round" fill="none"/>

  <!-- S 上段色带：珊瑚 -->
  <path d="M 28 10 C 11 10 7.5 18 20 20.5"
        stroke="#e0523e" stroke-width="7.5"
        stroke-linecap="round" fill="none"/>

  <!-- 纸张折角 -->
  <path d="M 24 7.5 L 28.5 10.5 L 24 11.5"
        fill="rgba(255,160,140,0.45)"
        stroke="#f07060" stroke-width="0.9"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 桥形连接点 -->
  <circle cx="20" cy="20.5" r="2.4" fill="#3a8060" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
  <circle cx="20" cy="20.5" r="1.0" fill="#e0523e"/>
</svg>
