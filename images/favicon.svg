<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bgF" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fdf6f0"/>
      <stop offset="55%"  stop-color="#f4ece2"/>
      <stop offset="100%" stop-color="#e9e0d4"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bgF)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4"
        stroke="rgba(200,60,40,0.18)" fill="none" stroke-width="0.8"/>

  <!-- S 下段：墨绿 -->
  <path d="M 16 16.4 C 26.4 19.2 23.2 25.2 9.6 25.6"
        stroke="#2a6647" stroke-width="6"
        stroke-linecap="round" fill="none"/>

  <!-- S 上段：珊瑚 -->
  <path d="M 22.4 8 C 8.8 8 6 14.4 16 16.4"
        stroke="#cc4030" stroke-width="6"
        stroke-linecap="round" fill="none"/>

  <!-- 折角 -->
  <path d="M 19.2 6 L 22.8 8.4 L 19.2 9.2"
        fill="rgba(240,200,190,0.9)"
        stroke="#e06050" stroke-width="0.75"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 连接点 -->
  <circle cx="16" cy="16.4" r="1.9" fill="#2a6647" stroke="rgba(255,255,255,0.95)" stroke-width="1"/>
  <circle cx="16" cy="16.4" r="0.8" fill="#cc4030"/>
</svg>
