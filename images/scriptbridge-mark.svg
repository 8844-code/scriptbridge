<!--
  剧桥 / ScriptBridge — Nav Mark (light mode, ~36px)
  S 双色带设计：上段珊瑚 + 下段墨绿，粗色带，高对比度
  灵感：S形剧本纸张 + 桥形连接点
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bgL" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fdf6f0"/>
      <stop offset="55%"  stop-color="#f4ece2"/>
      <stop offset="100%" stop-color="#e9e0d4"/>
    </linearGradient>
  </defs>

  <!-- 暖米底板 -->
  <rect width="40" height="40" rx="10" fill="url(#bgL)"/>
  <!-- 珊瑚描边 -->
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25"
        stroke="rgba(200,60,40,0.18)" fill="none" stroke-width="1"/>

  <!-- S 下段色带：墨绿（先画，在珊瑚层后面） -->
  <path d="M 20 20.5 C 33 24 29 31.5 12 32"
        stroke="#2a6647" stroke-width="7.5"
        stroke-linecap="round" fill="none"/>

  <!-- S 上段色带：珊瑚 -->
  <path d="M 28 10 C 11 10 7.5 18 20 20.5"
        stroke="#cc4030" stroke-width="7.5"
        stroke-linecap="round" fill="none"/>

  <!-- 纸张折角 dog-ear（剧本稿纸暗示） -->
  <path d="M 24 7.5 L 28.5 10.5 L 24 11.5"
        fill="rgba(240,200,190,0.9)"
        stroke="#e06050" stroke-width="0.9"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 桥形连接点 -->
  <circle cx="20" cy="20.5" r="2.4" fill="#2a6647" stroke="rgba(255,255,255,0.95)" stroke-width="1.2"/>
  <circle cx="20" cy="20.5" r="1.0" fill="#cc4030"/>
</svg>
