<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>

  <style>
    .page-wrapper { position: relative; }
    .page-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 77, 46, 0.08), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(61, 107, 79, 0.1), transparent 35%);
      pointer-events: none;
    }
    .auth-container {
      max-width: 440px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 22px;
      padding: 36px 30px 28px;
      box-shadow: 0 14px 36px rgba(26, 26, 26, 0.08);
      backdrop-filter: blur(4px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .auth-header p {
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group input {
      border-radius: 12px;
      border: 1px solid rgba(26, 26, 26, 0.14);
      background: rgba(255, 255, 255, 0.84);
    }
    .form-group input:focus {
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }
    .btn-primary {
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(140deg, #2f5a40 0%, #3d6b4f 100%);
      box-shadow: 0 10px 18px rgba(61, 107, 79, 0.24);
    }
    .btn-primary:hover {
      background: linear-gradient(140deg, #2a5139 0%, #365f46 100%);
      transform: translateY(-1px);
    }
    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
    .switch-link a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 26, 0.3);
      transition: all 0.2s;
      font-weight: 600;
    }
    .switch-link a:hover {
      color: var(--coral);
      border-bottom-color: var(--coral);
    }
    @media (max-width: 768px) {
      .auth-card { padding: 24px 16px 18px; }
      .auth-header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark" aria-hidden="true"></div>
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button class="active" onclick="setLang('en')">EN</button>
        <button onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1><span class="en-only">Reset Password</span><span class="zh-only">重置密码</span></h1>
          <p>
            <span class="en-only">Set a new password for your account</span>
            <span class="zh-only">为你的账户设置新密码</span>
          </p>
        </div>

        <div id="alert-container"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="password"><span class="en-only">New Password</span><span class="zh-only">新密码</span></label>
            <input type="password" id="password" placeholder="At least 8 characters" required>
            <div class="form-error" id="password-error"></div>
          </div>
          <div class="form-group">
            <label for="confirm-password"><span class="en-only">Confirm Password</span><span class="zh-only">确认密码</span></label>
            <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            <div class="form-error" id="confirm-error"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span id="btn-text"><span class="en-only">Update Password</span><span class="zh-only">更新密码</span></span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="switch-link">
          <span class="en-only"><a href="login.html">Back to sign in</a></span>
          <span class="zh-only"><a href="login.html">返回登录</a></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function setLang(lang) {
      document.body.classList.toggle('zh', lang === 'zh');
      document.querySelectorAll('.lang-pill button').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && lang === 'en') || (i === 1 && lang === 'zh'));
      });
      localStorage.setItem('scriptbridge_lang', lang);
    }

    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');

    function isZh() {
      return document.body.classList.contains('zh');
    }

    function showAlert(message, type) {
      alertContainer.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
      window.scrollTo(0, 0);
    }

    function clearErrors() {
      document.getElementById('password-error').textContent = '';
      document.getElementById('confirm-error').textContent = '';
    }

    function validate() {
      clearErrors();
      let valid = true;
      if (!passwordInput.value || passwordInput.value.length < 8) {
        document.getElementById('password-error').textContent = isZh() ? '密码至少 8 位' : 'Password must be at least 8 characters';
        valid = false;
      }
      if (passwordInput.value !== confirmInput.value) {
        document.getElementById('confirm-error').textContent = isZh() ? '两次密码不一致' : 'Passwords do not match';
        valid = false;
      }
      return valid;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validate()) return;

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';
      try {
        const { error } = await window.supabase_client.auth.updateUser({ password: passwordInput.value });
        if (error) throw error;
        showAlert(isZh() ? '密码已更新，请重新登录。' : 'Password updated. Please sign in again.', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } catch (error) {
        showAlert((isZh() ? '重置失败：' : 'Reset failed: ') + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setLang(localStorage.getItem('scriptbridge_lang') || 'en');
    });
  </script>
</body>
</html>
