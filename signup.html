<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF4D2E'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>

  <style>
    .page-wrapper {
      position: relative;
    }

    .page-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 77, 46, 0.08), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(61, 107, 79, 0.1), transparent 35%);
      pointer-events: none;
    }

    .auth-container {
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 22px;
      padding: 36px 30px 28px;
      box-shadow: 0 14px 36px rgba(26, 26, 26, 0.08);
      backdrop-filter: blur(4px);
    }

    :root.theme-dark .auth-card {
      background: #0f172a !important;
      border-color: rgba(248, 250, 252, 0.28) !important;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42) !important;
    }

    .signup-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .signup-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .signup-header p {
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    :root.theme-dark .signup-header h1,
    :root.theme-dark .signup-header p,
    :root.theme-dark .form-group label,
    :root.theme-dark .switch-link {
      color: #f8fafc !important;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group input {
      border-radius: 12px;
      border: 1px solid rgba(26, 26, 26, 0.14);
      background: rgba(255, 255, 255, 0.84);
    }

    :root.theme-dark .form-group input {
      background: #1e293b !important;
      border-color: rgba(248, 250, 252, 0.32) !important;
      color: #f8fafc !important;
    }

    :root.theme-dark .form-group input::placeholder {
      color: rgba(248, 250, 252, 0.72) !important;
    }

    .form-group input:focus {
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }

    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }

    .role-option {
      flex: 1;
      position: relative;
    }

    .role-option input {
      display: none;
    }

    .role-option label {
      display: block;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(26, 26, 26, 0.16);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      margin-bottom: 0;
    }

    .role-option input:checked + label {
      border-color: rgba(61, 107, 79, 0.8);
      background: rgba(61, 107, 79, 0.1);
      color: var(--sage);
      font-weight: 600;
    }

    .role-option label:hover {
      border-color: rgba(61, 107, 79, 0.6);
    }

    :root.theme-dark .role-option label {
      background: rgba(255, 255, 255, 0.09) !important;
      border-color: rgba(248, 250, 252, 0.26) !important;
      color: #e2e8f0 !important;
    }

    .btn-primary {
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(140deg, #2f5a40 0%, #3d6b4f 100%);
      box-shadow: 0 10px 18px rgba(61, 107, 79, 0.24);
    }

    .btn-primary:hover {
      background: linear-gradient(140deg, #2a5139 0%, #365f46 100%);
      transform: translateY(-1px);
    }

    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .switch-link a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 26, 0.3);
      transition: all 0.2s;
      font-weight: 600;
    }

    .switch-link a:hover {
      color: var(--coral);
    }

    :root.theme-dark .switch-link a {
      color: #f8fafc !important;
      border-bottom-color: rgba(248, 250, 252, 0.62) !important;
    }

    @media (max-width: 768px) {
      .auth-card {
        padding: 24px 16px 18px;
      }

      .signup-header h1 {
        font-size: 28px;
      }

      .role-selector {
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      .auth-container {
        max-width: 100%;
      }

      .signup-header {
        margin-bottom: 20px;
      }

      .signup-header h1 {
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .role-selector {
        flex-direction: column;
      }

      .role-option label {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark">S</div>
      <div>
        <div class="nav-logo-text">ScriptBridge</div>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button class="active" onclick="setLang('en')">EN</button>
        <button onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </nav>

  <!-- 主页面 -->
  <div class="page-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        <div class="signup-header">
          <h1><span class="en-only">Create Account</span><span class="zh-only">创建账户</span></h1>
          <p><span class="en-only">Join ScriptBridge to share and discover scripts</span><span class="zh-only">加入 ScriptBridge 分享和发现剧本</span></p>
        </div>

        <div id="alert-container"></div>

        <form id="signup-form">
          <!-- 角色选择 -->
          <div class="form-group">
            <label><span class="en-only">I am a...</span><span class="zh-only">我的身份...</span></label>
            <div class="role-selector">
              <div class="role-option">
                <input type="radio" id="role-creator" name="role" value="creator" required>
                <label for="role-creator"><span class="en-only">Script Creator</span><span class="zh-only">剧本创作者</span></label>
              </div>
              <div class="role-option">
                <input type="radio" id="role-buyer" name="role" value="buyer" required>
                <label for="role-buyer"><span class="en-only">Buyer</span><span class="zh-only">买家</span></label>
              </div>
            </div>
          </div>

          <!-- 邮箱 -->
          <div class="form-group">
            <label for="email"><span class="en-only">Email Address</span><span class="zh-only">邮箱</span></label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
            <div class="form-error" id="email-error"></div>
          </div>

          <!-- 密码 -->
          <div class="form-group">
            <label for="password"><span class="en-only">Password</span><span class="zh-only">密码</span></label>
            <input type="password" id="password" name="password" required placeholder="At least 8 characters">
            <div class="form-error" id="password-error"></div>
          </div>

          <!-- 确认密码 -->
          <div class="form-group">
            <label for="confirm-password"><span class="en-only">Confirm Password</span><span class="zh-only">确认密码</span></label>
            <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm your password">
            <div class="form-error" id="confirm-error"></div>
          </div>

          <!-- 提交按钮 -->
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span id="btn-text"><span class="en-only">Create Account</span><span class="zh-only">创建账户</span></span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="switch-link">
          <span class="en-only">Already have an account? <a href="login.html">Sign in</a></span>
          <span class="zh-only">已有账户？<a href="login.html">立即登录</a></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 初始化 Supabase -->
  <script src="js/supabase-client.js"></script>

  <script>
    // 语言切换
    function setLang(lang) {
      document.body.classList.toggle('zh', lang === 'zh');
      document.querySelectorAll('.lang-pill button').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && lang === 'en') || (i === 1 && lang === 'zh'));
      });
      localStorage.setItem('scriptbridge_lang', lang);
    }

    // 初始化语言
    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('scriptbridge_lang') || 'en';
      setLang(savedLang);
    });

    const form = document.getElementById('signup-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');

    // 表单验证
    function validateForm() {
      let isValid = true;
      const isZh = document.body.classList.contains('zh');

      // 清空错误提示
      document.getElementById('email-error').textContent = '';
      document.getElementById('password-error').textContent = '';
      document.getElementById('confirm-error').textContent = '';

      // 检查邮箱
      if (!emailInput.value) {
        document.getElementById('email-error').textContent = isZh ? '请输入邮箱' : 'Email is required';
        isValid = false;
      } else if (!emailInput.value.includes('@')) {
        document.getElementById('email-error').textContent = isZh ? '请输入有效邮箱' : 'Please enter a valid email';
        isValid = false;
      }

      // 检查密码长度
      if (!passwordInput.value) {
        document.getElementById('password-error').textContent = isZh ? '请输入密码' : 'Password is required';
        isValid = false;
      } else if (passwordInput.value.length < 8) {
        document.getElementById('password-error').textContent = isZh ? '密码至少 8 位' : 'Password must be at least 8 characters';
        isValid = false;
      }

      // 检查密码一致性
      if (passwordInput.value !== confirmInput.value) {
        document.getElementById('confirm-error').textContent = isZh ? '两次密码不一致' : 'Passwords do not match';
        isValid = false;
      }

      return isValid;
    }

    // 显示提示消息
    function showAlert(message, type) {
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      window.scrollTo(0, 0);
    }

    // 处理表单提交
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 验证表单
      if (!validateForm()) {
        return;
      }

      // 禁用按钮并显示加载状态
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const role = document.querySelector('input[name="role"]:checked').value;

      try {
        // 第一步：使用 Supabase Auth 注册
        const { data, error } = await window.supabase_client.auth.signUp({
          email: email,
          password: password,
        });

        if (error) {
          throw new Error(error.message);
        }

        // 第二步：在 users 表中创建用户记录
        const { user } = data;
        if (user) {
          const { error: insertError } = await window.supabase_client
            .from('users')
            .insert({
              user_id: user.id,
              email: email,
              role: role,
            });

          if (insertError) {
            throw new Error('Failed to create user profile: ' + insertError.message);
          }
        }

        // 注册成功
        showAlert(document.body.classList.contains('zh') ? '创建成功！正在跳转到登录页...' : 'Account created successfully! Redirecting to login...', 'success');

        // 2 秒后重定向到登录页
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        showAlert((document.body.classList.contains('zh') ? '注册失败：' : 'Sign up failed: ') + error.message, 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
