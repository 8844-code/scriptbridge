<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=20260510">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>

  <style>
    .dashboard-wrapper {
      min-height: 100vh;
      padding: 100px 40px 80px;
      background: var(--cream);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .user-avatar-link {
      text-decoration: none;
      flex-shrink: 0;
      border-radius: 50%;
      outline: none;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .user-avatar-link:hover .user-avatar,
    .user-avatar-link:focus-visible .user-avatar {
      box-shadow: 0 0 0 3px rgba(242, 106, 79, 0.45);
      transform: scale(1.04);
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--coral), var(--sage));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
    }

    .user-details h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .user-details p {
      font-size: 14px;
      color: var(--muted);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .action-card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--ink);
    }

    .action-card:hover {
      border-color: var(--coral);
      box-shadow: 0 4px 12px rgba(255, 77, 46, 0.2);
      transform: translateY(-4px);
    }

    .action-card-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .action-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .action-card-desc {
      font-size: 14px;
      color: var(--muted);
    }

    .profile-section {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-section h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--ink);
    }

    .profile-field {
      margin-bottom: 16px;
    }

    .profile-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .profile-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .profile-label-row label {
      margin-bottom: 0;
    }

    .profile-field p {
      font-size: 16px;
      color: var(--ink);
    }

    .profile-edit-hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.45;
    }

    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .lang-pill {
      display: flex;
      background: #0f172a;
      border-radius: var(--r-pill);
      overflow: hidden;
      padding: 3px;
      gap: 2px;
      border: 1px solid rgba(248, 250, 252, 0.2);
    }

    .lang-pill button {
      border: none;
      background: transparent;
      color: rgba(248, 250, 252, 0.78);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--r-pill);
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-pill button.active {
      background: var(--coral);
      color: #fff;
    }

    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 74px 14px 48px;
      }

      .dashboard-header h1 {
        font-size: 24px;
      }

      .user-avatar {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .action-card {
        padding: 18px 14px;
      }

      .profile-section {
        padding: 16px 14px;
      }

      .user-info {
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .lang-pill button {
        padding: 4px 10px;
      }
    }

    @media (max-width: 480px) {
      .dashboard-wrapper {
        padding-top: 68px;
      }

      .dashboard-header {
        margin-bottom: 20px;
      }

      .dashboard-header h1 {
        font-size: 22px;
      }

      .user-details h2 {
        font-size: 17px;
      }

      .action-card-title {
        font-size: 16px;
      }

      .action-card-desc {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark" aria-hidden="true"><img src="images/scriptbridge-mark.svg?v=20260510" alt=""></div>
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button id="lang-en" type="button">EN</button>
        <button id="lang-zh" type="button">中文</button>
      </div>
      <button id="nav-logout-btn" class="btn btn-logout" type="button" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <!-- 仪表板 -->
  <div class="dashboard-wrapper">
    <div class="container">
      <div class="dashboard-header">
        <h1 id="dashboard-title">Dashboard</h1>
      </div>

      <!-- 加载状态 -->
      <div id="loading" class="loading-spinner">
        <div class="spinner"></div>
        <span id="loading-text" style="margin-left: 12px; color: var(--muted);">Loading...</span>
      </div>

      <!-- 用户信息卡片 -->
      <div id="user-card" style="display: none;">
        <div class="user-info">
          <a href="profile-edit.html" class="user-avatar-link" id="avatar-to-profile" title="">
            <div class="user-avatar" id="user-avatar" aria-hidden="true">U</div>
          </a>
          <div class="user-details">
            <h2 id="user-name">Loading...</h2>
            <p id="user-email">Loading...</p>
            <p id="user-role" style="font-weight: 500; color: var(--coral);"></p>
          </div>
        </div>

        <!-- 根据角色显示不同的卡片 -->
        <div class="dashboard-grid" id="action-cards"></div>

        <!-- 用户资料部分 -->
        <div class="profile-section">
          <h3 id="account-info-title">Account Information</h3>
          <div class="profile-field">
            <label id="profile-label-email">Email</label>
            <p id="profile-email">—</p>
          </div>
          <div class="profile-field">
            <label id="profile-label-role">Role</label>
            <p id="profile-role">—</p>
          </div>
          <div class="profile-field">
            <label id="profile-label-bio">Bio</label>
            <p id="profile-bio">—</p>
            <p id="profile-avatar-hint" class="profile-edit-hint"></p>
          </div>
          <div class="profile-field">
            <label id="profile-label-joined">Member Since</label>
            <p id="profile-joined">—</p>
          </div>
        </div>

        <!-- 登出按钮 -->
        <button id="bottom-logout-btn" class="btn btn-secondary" onclick="logout()" style="width: 100%;">
          Log Out
        </button>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 初始化 Supabase 和认证 -->
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const loadingEl = document.getElementById('loading');
    const userCardEl = document.getElementById('user-card');
    const actionCardsEl = document.getElementById('action-cards');
    const langEnBtn = document.getElementById('lang-en');
    const langZhBtn = document.getElementById('lang-zh');

    const I18N = {
      en: {
        dashboardTitle: 'Dashboard',
        loading: 'Loading...',
        accountInfo: 'Account Information',
        labelEmail: 'Email',
        labelRole: 'Role',
        labelBio: 'Bio',
        labelJoined: 'Member Since',
        avatarHint: 'Click your avatar above to edit your display name and bio.',
        logout: 'Log Out',
        roleCreator: 'Script Creator',
        roleBuyer: 'Buyer',
        noBio: 'No bio yet',
        creatorCards: `
          <a href="scripts-upload.html" class="action-card">
            <div class="action-card-icon">📝</div>
            <div class="action-card-title">Upload Script</div>
            <div class="action-card-desc">Share your new script</div>
          </a>
          <a href="scripts-list-author.html" class="action-card">
            <div class="action-card-icon">📚</div>
            <div class="action-card-title">My Scripts</div>
            <div class="action-card-desc">Manage your scripts</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">🔍</div>
            <div class="action-card-title">Browse Market</div>
            <div class="action-card-desc">Discover other scripts</div>
          </a>
          <a href="admin-waitlist.html" class="action-card">
            <div class="action-card-icon">📈</div>
            <div class="action-card-title">Waitlist Stats</div>
            <div class="action-card-desc">Track signup performance</div>
          </a>
          <a href="my-inquiries.html" class="action-card">
            <div class="action-card-icon">💬</div>
            <div class="action-card-title">My Applications</div>
            <div class="action-card-desc">View license applications you've sent or received</div>
          </a>
        `,
        buyerCards: `
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">🔍</div>
            <div class="action-card-title">Browse Scripts</div>
            <div class="action-card-desc">Find scripts to buy</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">❤️</div>
            <div class="action-card-title">Favorites</div>
            <div class="action-card-desc">Your saved scripts</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">📦</div>
            <div class="action-card-title">My Purchases</div>
            <div class="action-card-desc">Scripts you own</div>
          </a>
          <a href="admin-waitlist.html" class="action-card">
            <div class="action-card-icon">📈</div>
            <div class="action-card-title">Waitlist Stats</div>
            <div class="action-card-desc">View live signup data</div>
          </a>
          <a href="my-inquiries.html" class="action-card">
            <div class="action-card-icon">💬</div>
            <div class="action-card-title">My Applications</div>
            <div class="action-card-desc">View license applications you've sent or received</div>
          </a>
        `,
        failedLoad: 'Failed to load dashboard: '
      },
      zh: {
        dashboardTitle: '个人主页',
        loading: '加载中...',
        accountInfo: '账号信息',
        labelEmail: '邮箱',
        labelRole: '角色',
        labelBio: '简介',
        labelJoined: '注册时间',
        avatarHint: '点击上方头像即可编辑显示名称与个人简介。',
        logout: '退出登录',
        roleCreator: '创作者',
        roleBuyer: '买家',
        noBio: '暂无简介',
        creatorCards: `
          <a href="scripts-upload.html" class="action-card">
            <div class="action-card-icon">📝</div>
            <div class="action-card-title">上传作品</div>
            <div class="action-card-desc">发布你的新作品</div>
          </a>
          <a href="scripts-list-author.html" class="action-card">
            <div class="action-card-icon">📚</div>
            <div class="action-card-title">我的作品</div>
            <div class="action-card-desc">管理已上传作品</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">🔍</div>
            <div class="action-card-title">浏览市场</div>
            <div class="action-card-desc">发现其他优质作品</div>
          </a>
          <a href="admin-waitlist.html" class="action-card">
            <div class="action-card-icon">📈</div>
            <div class="action-card-title">候补统计</div>
            <div class="action-card-desc">跟踪报名转化数据</div>
          </a>
          <a href="my-inquiries.html" class="action-card">
            <div class="action-card-icon">💬</div>
            <div class="action-card-title">我的申请</div>
            <div class="action-card-desc">查看你发出或收到的授权申请</div>
          </a>
        `,
        buyerCards: `
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">🔍</div>
            <div class="action-card-title">浏览市场</div>
            <div class="action-card-desc">寻找可购买作品</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">❤️</div>
            <div class="action-card-title">收藏夹</div>
            <div class="action-card-desc">查看已收藏作品</div>
          </a>
          <a href="scripts-browse.html" class="action-card">
            <div class="action-card-icon">📦</div>
            <div class="action-card-title">我的购买</div>
            <div class="action-card-desc">查看已购买版权</div>
          </a>
          <a href="admin-waitlist.html" class="action-card">
            <div class="action-card-icon">📈</div>
            <div class="action-card-title">候补统计</div>
            <div class="action-card-desc">查看实时报名数据</div>
          </a>
          <a href="my-inquiries.html" class="action-card">
            <div class="action-card-icon">💬</div>
            <div class="action-card-title">我的申请</div>
            <div class="action-card-desc">查看你发出或收到的授权申请</div>
          </a>
        `,
        failedLoad: '加载失败：'
      }
    };

    let currentLang = localStorage.getItem('scriptbridge_lang') || 'en';
    let currentUserData = null;
    let currentProfile = null;

    function t(key) {
      return I18N[currentLang][key];
    }

    function applyLanguageUI() {
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.body.classList.toggle('zh', currentLang === 'zh');
      langEnBtn.classList.toggle('active', currentLang === 'en');
      langZhBtn.classList.toggle('active', currentLang === 'zh');
      document.getElementById('dashboard-title').textContent = t('dashboardTitle');
      document.getElementById('loading-text').textContent = t('loading');
      document.getElementById('account-info-title').textContent = t('accountInfo');
      document.getElementById('profile-label-email').textContent = t('labelEmail');
      document.getElementById('profile-label-role').textContent = t('labelRole');
      document.getElementById('profile-label-bio').textContent = t('labelBio');
      document.getElementById('profile-label-joined').textContent = t('labelJoined');
      const hintEl = document.getElementById('profile-avatar-hint');
      if (hintEl) hintEl.textContent = t('avatarHint');
      document.getElementById('nav-logout-btn').textContent = t('logout');
      document.getElementById('bottom-logout-btn').textContent = t('logout');

      const avLink = document.getElementById('avatar-to-profile');
      if (avLink) avLink.setAttribute('title', currentLang === 'zh' ? '编辑资料' : 'Edit profile');
    }

    function renderDashboardContent() {
      if (!currentUserData || !currentProfile) return;

      const roleText = currentProfile.role === 'creator' ? t('roleCreator') : t('roleBuyer');
      const initial = (currentProfile.full_name || currentUserData.email).charAt(0).toUpperCase();

      document.getElementById('user-avatar').textContent = initial;
      document.getElementById('user-name').textContent = currentProfile.full_name || 'User';
      document.getElementById('user-email').textContent = currentUserData.email;
      document.getElementById('user-role').textContent = roleText;

      document.getElementById('profile-email').textContent = currentUserData.email;
      document.getElementById('profile-role').textContent = roleText;
      document.getElementById('profile-bio').textContent = currentProfile.bio || t('noBio');
      document.getElementById('profile-joined').textContent = new Date(currentProfile.created_at).toLocaleDateString();
      actionCardsEl.innerHTML = currentProfile.role === 'creator' ? t('creatorCards') : t('buyerCards');

      const hintEl = document.getElementById('profile-avatar-hint');
      if (hintEl) hintEl.textContent = t('avatarHint');
      const avLink = document.getElementById('avatar-to-profile');
      if (avLink) avLink.setAttribute('title', currentLang === 'zh' ? '编辑资料' : 'Edit profile');
    }

    function setLang(lang) {
      currentLang = lang === 'zh' ? 'zh' : 'en';
      localStorage.setItem('scriptbridge_lang', currentLang);
      applyLanguageUI();
      renderDashboardContent();
    }

    async function initDashboard() {
      try {
        applyLanguageUI();

        // 1. 检查用户是否已登录
        const session = await checkAuthStatus();
        if (!session) {
          window.location.href = 'login.html';
          return;
        }

        // 2. 获取当前用户
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        // 3. 获取用户资料
        const profile = await getUserProfile(user.id);
        if (!profile) {
          throw new Error('Failed to load user profile');
        }

        currentUserData = user;
        currentProfile = profile;
        renderDashboardContent();

        // 6. 隐藏加载状态，显示内容
        loadingEl.style.display = 'none';
        userCardEl.style.display = 'block';

      } catch (error) {
        console.error('Error initializing dashboard:', error);
        loadingEl.innerHTML = `<div class="alert alert-error">${t('failedLoad')}${error.message}</div>`;
      }
    }

    langEnBtn.addEventListener('click', () => setLang('en'));
    langZhBtn.addEventListener('click', () => setLang('zh'));

    // 页面加载时初始化
    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
