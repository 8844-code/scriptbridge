<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF4D2E'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">

  <style>
    .dashboard-wrapper {
      min-height: 100vh;
      padding: 100px 40px 80px;
      background: var(--cream);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--coral), var(--sage));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
    }

    .user-details h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .user-details p {
      font-size: 14px;
      color: var(--muted);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .action-card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--ink);
    }

    .action-card:hover {
      border-color: var(--coral);
      box-shadow: 0 4px 12px rgba(255, 77, 46, 0.2);
      transform: translateY(-4px);
    }

    .action-card-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .action-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .action-card-desc {
      font-size: 14px;
      color: var(--muted);
    }

    .profile-section {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-section h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--ink);
    }

    .profile-field {
      margin-bottom: 16px;
    }

    .profile-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .profile-field p {
      font-size: 16px;
      color: var(--ink);
    }

    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 80px 20px 60px;
      }

      .dashboard-header h1 {
        font-size: 24px;
      }

      .user-avatar {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark">S</div>
      <div>
        <div class="nav-logo-text">ScriptBridge</div>
      </div>
    </a>
    <div class="nav-right"></div>
  </nav>

  <!-- 仪表板 -->
  <div class="dashboard-wrapper">
    <div class="container">
      <div class="dashboard-header">
        <h1>Dashboard</h1>
      </div>

      <!-- 加载状态 -->
      <div id="loading" class="loading-spinner">
        <div class="spinner"></div>
        <span style="margin-left: 12px; color: var(--muted);">Loading...</span>
      </div>

      <!-- 用户信息卡片 -->
      <div id="user-card" style="display: none;">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-details">
            <h2 id="user-name">Loading...</h2>
            <p id="user-email">Loading...</p>
            <p id="user-role" style="font-weight: 500; color: var(--coral);"></p>
          </div>
        </div>

        <!-- 根据角色显示不同的卡片 -->
        <div class="dashboard-grid" id="action-cards"></div>

        <!-- 用户资料部分 -->
        <div class="profile-section">
          <h3>Account Information</h3>
          <div class="profile-field">
            <label>Email</label>
            <p id="profile-email">—</p>
          </div>
          <div class="profile-field">
            <label>Role</label>
            <p id="profile-role">—</p>
          </div>
          <div class="profile-field">
            <label>Bio</label>
            <p id="profile-bio">—</p>
          </div>
          <div class="profile-field">
            <label>Member Since</label>
            <p id="profile-joined">—</p>
          </div>
        </div>

        <!-- 登出按钮 -->
        <button class="btn btn-secondary" onclick="logout()" style="width: 100%;">
          Log Out
        </button>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 初始化 Supabase 和认证 -->
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const loadingEl = document.getElementById('loading');
    const userCardEl = document.getElementById('user-card');
    const actionCardsEl = document.getElementById('action-cards');

    async function initDashboard() {
      try {
        // 1. 检查用户是否已登录
        const session = await checkAuthStatus();
        if (!session) {
          window.location.href = 'login.html';
          return;
        }

        // 2. 获取当前用户
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        // 3. 获取用户资料
        const profile = await getUserProfile(user.id);
        if (!profile) {
          throw new Error('Failed to load user profile');
        }

        // 4. 填充用户信息
        const roleText = profile.role === 'creator' ? 'Script Creator' : 'Buyer';
        const initial = (profile.full_name || user.email).charAt(0).toUpperCase();

        document.getElementById('user-avatar').textContent = initial;
        document.getElementById('user-name').textContent = profile.full_name || 'User';
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-role').textContent = roleText;

        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-role').textContent = roleText;
        document.getElementById('profile-bio').textContent = profile.bio || 'No bio yet';
        document.getElementById('profile-joined').textContent = new Date(profile.created_at).toLocaleDateString();

        // 5. 根据角色显示不同的卡片
        let cardsHTML = '';

        if (profile.role === 'creator') {
          cardsHTML = `
            <a href="scripts-upload.html" class="action-card">
              <div class="action-card-icon">📝</div>
              <div class="action-card-title">Upload Script</div>
              <div class="action-card-desc">Share your new script</div>
            </a>
            <a href="scripts-list-author.html" class="action-card">
              <div class="action-card-icon">📚</div>
              <div class="action-card-title">My Scripts</div>
              <div class="action-card-desc">Manage your scripts</div>
            </a>
            <a href="scripts-browse.html" class="action-card">
              <div class="action-card-icon">🔍</div>
              <div class="action-card-title">Browse Market</div>
              <div class="action-card-desc">Discover other scripts</div>
            </a>
          `;
        } else {
          cardsHTML = `
            <a href="scripts-browse.html" class="action-card">
              <div class="action-card-icon">🔍</div>
              <div class="action-card-title">Browse Scripts</div>
              <div class="action-card-desc">Find scripts to buy</div>
            </a>
            <a href="scripts-browse.html" class="action-card">
              <div class="action-card-icon">❤️</div>
              <div class="action-card-title">Favorites</div>
              <div class="action-card-desc">Your saved scripts</div>
            </a>
            <a href="scripts-browse.html" class="action-card">
              <div class="action-card-icon">📦</div>
              <div class="action-card-title">My Purchases</div>
              <div class="action-card-desc">Scripts you own</div>
            </a>
          `;
        }

        actionCardsEl.innerHTML = cardsHTML;

        // 6. 隐藏加载状态，显示内容
        loadingEl.style.display = 'none';
        userCardEl.style.display = 'block';

        // 7. 设置导航栏的登出按钮
        setupAuthNav();

      } catch (error) {
        console.error('Error initializing dashboard:', error);
        loadingEl.innerHTML = `<div class="alert alert-error">Failed to load dashboard: ${error.message}</div>`;
      }
    }

    // 页面加载时初始化
    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
