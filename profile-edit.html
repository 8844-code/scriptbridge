<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/scriptbridge-mark.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>
  <style>
    .upload-wrapper {
      min-height: 100vh;
      padding: 100px 40px 80px;
      position: relative;
    }
    .upload-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 77, 46, 0.07), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(61, 107, 79, 0.09), transparent 34%);
      pointer-events: none;
    }
    .upload-container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .upload-header {
      margin-bottom: 24px;
    }
    .upload-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .upload-header p {
      color: var(--muted);
      font-size: 15px;
    }
    .upload-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 14px 36px rgba(26, 26, 26, 0.08);
      backdrop-filter: blur(4px);
    }
    .form-group {
      margin-bottom: 18px;
    }
    /* 输入框沿用 common.css 主题变量；不在此写死浅色底，以免暗色模式发灰白块 */
    .form-group input:not([type="radio"]):not([type="checkbox"]),
    .form-group textarea {
      border-radius: 12px;
    }
    .form-group textarea {
      min-height: 130px;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-save {
      flex: 1;
      min-width: 180px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(140deg, #2f5a40 0%, #3d6b4f 100%);
      box-shadow: 0 10px 18px rgba(61, 107, 79, 0.24);
    }
    .btn-save:hover {
      background: linear-gradient(140deg, #2a5139 0%, #365f46 100%);
      transform: translateY(-1px);
    }
    .btn-cancel {
      min-width: 220px;
      border-radius: 12px;
    }
    .nav-user-menu {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 8px 14px;
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    @media (max-width: 768px) {
      .upload-wrapper {
        padding: 80px 20px 60px;
      }
      .upload-header h1 {
        font-size: 28px;
      }
      .upload-card {
        padding: 22px;
      }
      .action-row {
        flex-direction: column;
      }
      .btn-save,
      .btn-cancel {
        width: 100%;
      }
      .nav-user-menu {
        display: none;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="dashboard.html" class="nav-logo">
      <img class="nav-logo-mark" src="images/scriptbridge-mark.svg?v=2" alt="" width="40" height="40" decoding="async">
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button id="lang-en" type="button">EN</button>
        <button id="lang-zh" type="button">中文</button>
      </div>
      <a href="dashboard.html" class="btn btn-outline back-link" id="back-link">← Back to Dashboard</a>
      <div id="nav-user-menu" class="nav-user-menu">Loading user...</div>
      <button type="button" class="btn btn-logout" id="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <main class="upload-wrapper">
    <div class="upload-container">
      <header class="upload-header">
        <h1 id="page-title">Edit Profile</h1>
        <p id="page-subtitle">Update your public profile information.</p>
      </header>

      <section class="upload-card">
        <div id="alert-container"></div>
        <form id="profile-form">
          <div class="form-group">
            <label for="display-name" id="label-display-name">Display Name</label>
            <input type="text" id="display-name" name="full_name" maxlength="60" placeholder="How people should call you">
          </div>

          <div class="form-group">
            <label for="bio" id="label-bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="300" placeholder="A short introduction about your creative work"></textarea>
          </div>

          <div class="action-row">
            <button type="submit" class="btn btn-save" id="submit-btn">
              <span id="btn-text">Save Changes</span>
              <span id="btn-spinner" class="spinner" style="display:none;"></span>
            </button>
            <a href="dashboard.html" class="btn btn-outline btn-cancel" id="cancel-btn">← Back to Dashboard</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('profile-form');
    const nameInput = document.getElementById('display-name');
    const bioInput = document.getElementById('bio');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');
    const navUserMenu = document.getElementById('nav-user-menu');
    const langEnBtn = document.getElementById('lang-en');
    const langZhBtn = document.getElementById('lang-zh');

    let currentUser = null;
    let currentLang = localStorage.getItem('scriptbridge_lang') || 'en';
    const i18n = {
      en: {
        pageTitle: 'Edit Profile',
        pageSubtitle: 'Update your public profile information.',
        displayName: 'Display Name',
        displayNamePh: 'How people should call you',
        bio: 'Bio',
        bioPh: 'A short introduction about your creative work',
        save: 'Save Changes',
        cancel: '← Back to Dashboard',
        back: '← Back to Dashboard',
        logout: 'Log Out',
        loadFailed: 'Failed to load profile: ',
        saveFailed: 'Save failed: ',
        saveOk: 'Saved. Returning to dashboard...'
      },
      zh: {
        pageTitle: '编辑资料',
        pageSubtitle: '更新你的公开资料信息。',
        displayName: '显示名称',
        displayNamePh: '别人将看到的名称',
        bio: '个人简介',
        bioPh: '介绍一下你的创作方向',
        save: '保存修改',
        cancel: '← 返回主页',
        back: '← 返回主页',
        logout: '退出登录',
        loadFailed: '加载资料失败：',
        saveFailed: '保存失败：',
        saveOk: '已保存，正在返回主页...'
      }
    };

    function t(key) {
      return i18n[currentLang][key];
    }

    function setLang(lang) {
      currentLang = lang === 'zh' ? 'zh' : 'en';
      document.body.classList.toggle('zh', currentLang === 'zh');
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      localStorage.setItem('scriptbridge_lang', currentLang);
      langEnBtn.classList.toggle('active', currentLang === 'en');
      langZhBtn.classList.toggle('active', currentLang === 'zh');
      document.getElementById('page-title').textContent = t('pageTitle');
      document.getElementById('page-subtitle').textContent = t('pageSubtitle');
      document.getElementById('label-display-name').textContent = t('displayName');
      document.getElementById('label-bio').textContent = t('bio');
      document.getElementById('btn-text').textContent = t('save');
      document.getElementById('cancel-btn').textContent = t('cancel');
      document.getElementById('back-link').textContent = t('back');
      document.getElementById('logout-btn').textContent = t('logout');
      nameInput.placeholder = t('displayNamePh');
      bioInput.placeholder = t('bioPh');
    }

    function setSubmitting(isSubmitting) {
      submitBtn.disabled = isSubmitting;
      btnText.style.display = isSubmitting ? 'none' : 'inline';
      btnSpinner.style.display = isSubmitting ? 'inline-block' : 'none';
    }

    function showAlert(message, type) {
      alertContainer.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
      window.scrollTo(0, 0);
    }

    async function loadProfile() {
      const { data, error } = await window.supabase_client
        .from('users')
        .select('full_name, bio')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (error) throw error;
      nameInput.value = data?.full_name || '';
      bioInput.value = data?.bio || '';
    }

    async function initPage() {
      try {
        setLang(currentLang);
        const session = await requireAuth();
        if (!session) return;
        currentUser = await getCurrentUser();
        if (!currentUser) {
          window.location.href = 'login.html';
          return;
        }
        navUserMenu.textContent = currentUser.email || currentUser.id;
        await loadProfile();
      } catch (error) {
        showAlert(t('loadFailed') + error.message, 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      setSubmitting(true);

      try {
        const { error } = await window.supabase_client
          .from('users')
          .update({ full_name: nameInput.value.trim(), bio: bioInput.value.trim() })
          .eq('user_id', currentUser.id);

        if (error) throw error;
        showAlert(t('saveOk'), 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        showAlert(t('saveFailed') + error.message, 'error');
        setSubmitting(false);
      }
    });

    window.addEventListener('DOMContentLoaded', initPage);
    langEnBtn.addEventListener('click', () => setLang('en'));
    langZhBtn.addEventListener('click', () => setLang('zh'));
  </script>
</body>
</html>
