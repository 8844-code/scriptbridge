<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/scriptbridge-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>
  <style>
    .page-wrapper { position: relative; }
    .page-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 77, 46, 0.08), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(61, 107, 79, 0.1), transparent 35%);
      pointer-events: none;
    }
    .auth-container {
      max-width: 440px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 22px;
      padding: 36px 30px 28px;
      box-shadow: 0 14px 36px rgba(26, 26, 26, 0.08);
      backdrop-filter: blur(4px);
    }
    :root.theme-dark .auth-card {
      background: #0f172a !important;
      border-color: rgba(248, 250, 252, 0.28) !important;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42) !important;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .auth-header p {
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .form-group { margin-bottom: 18px; }
    .form-group input {
      border-radius: 12px;
      border: 1px solid rgba(26, 26, 26, 0.14);
      background: rgba(255, 255, 255, 0.84);
    }
    .form-group input:focus {
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }
    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
    .switch-link a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 26, 0.3);
      transition: all 0.2s;
      font-weight: 600;
    }
    .switch-link a:hover {
      color: var(--coral);
      border-bottom-color: var(--coral);
    }
    :root.theme-dark .auth-header h1,
    :root.theme-dark .auth-header p,
    :root.theme-dark .form-group label,
    :root.theme-dark .switch-link {
      color: #f8fafc !important;
    }
    :root.theme-dark .form-group input {
      background: #1e293b !important;
      border-color: rgba(248, 250, 252, 0.32) !important;
      color: #f8fafc !important;
    }
    :root.theme-dark .form-group input::placeholder {
      color: rgba(248, 250, 252, 0.72) !important;
    }
    :root.theme-dark .switch-link a {
      color: #f8fafc !important;
      border-bottom-color: rgba(248, 250, 252, 0.62) !important;
    }
    @media (max-width: 768px) {
      .auth-card { padding: 24px 16px 18px; }
      .auth-header h1 { font-size: 28px; }
    }
    @media (max-width: 480px) {
      .auth-header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark" aria-hidden="true"></div>
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button class="active" onclick="setLang('en')">EN</button>
        <button onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1><span class="en-only">Forgot Password</span><span class="zh-only">忘记密码</span></h1>
          <p>
            <span class="en-only">Enter your email to receive a password reset link</span>
            <span class="zh-only">输入邮箱以接收密码重置链接</span>
          </p>
        </div>

        <div id="alert-container"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="email"><span class="en-only">Email Address</span><span class="zh-only">邮箱</span></label>
            <input type="email" id="email" required placeholder="your@email.com">
            <div class="form-error" id="email-error"></div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span id="btn-text"><span class="en-only">Send Reset Link</span><span class="zh-only">发送重置链接</span></span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="switch-link">
          <span class="en-only">Remember your password? <a href="login.html">Back to sign in</a></span>
          <span class="zh-only">想起密码了？<a href="login.html">返回登录</a></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function setLang(lang) {
      document.body.classList.toggle('zh', lang === 'zh');
      document.querySelectorAll('.lang-pill button').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && lang === 'en') || (i === 1 && lang === 'zh'));
      });
      localStorage.setItem('scriptbridge_lang', lang);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('scriptbridge_lang') || 'en';
      setLang(savedLang);
    });

    const form = document.getElementById('reset-form');
    const emailInput = document.getElementById('email');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');

    function showAlert(message, type) {
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      window.scrollTo(0, 0);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const isZh = document.body.classList.contains('zh');
      document.getElementById('email-error').textContent = '';

      if (!emailInput.value || !emailInput.value.includes('@')) {
        document.getElementById('email-error').textContent = isZh ? '请输入有效邮箱' : 'Please enter a valid email';
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const email = emailInput.value.trim();
        const { error } = await window.supabase_client.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://8844-code.github.io/scriptbridge/reset-password.html'
        });
        if (error) throw error;
        showAlert(
          isZh ? '重置链接已发送，请查收邮件。' : 'Reset link sent! Check your email.',
          'success'
        );
      } catch (error) {
        showAlert((isZh ? '发送失败：' : 'Failed to send reset link: ') + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
