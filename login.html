<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF4D2E'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">

  <style>
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .login-header p {
      font-size: 16px;
      color: var(--muted);
    }

    .form-divider {
      text-align: center;
      margin: 24px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .signup-link a {
      color: var(--coral);
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--ink);
    }

    .remember-me input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark">S</div>
      <div>
        <div class="nav-logo-text">ScriptBridge</div>
      </div>
    </a>
    <div class="nav-right">
      <a href="signup.html" class="btn btn-outline">Create account</a>
    </div>
  </nav>

  <!-- 主页面 -->
  <div class="page-wrapper">
    <div class="auth-container">
      <div class="login-header">
        <h1>Sign In</h1>
        <p>Welcome back to ScriptBridge</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <!-- 邮箱 -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
          <div class="form-error" id="email-error"></div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password">
          <div class="form-error" id="password-error"></div>
        </div>

        <!-- 记住我 -->
        <div class="form-group">
          <label class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <!-- 提交按钮 -->
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 初始化 Supabase -->
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberInput = document.getElementById('remember');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');

    // 加载保存的邮箱（如果用户之前选择了"记住我"）
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('scriptbridge_saved_email');
      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberInput.checked = true;
      }
    });

    // 表单验证
    function validateForm() {
      let isValid = true;

      document.getElementById('email-error').textContent = '';
      document.getElementById('password-error').textContent = '';

      if (!emailInput.value) {
        document.getElementById('email-error').textContent = 'Email is required';
        isValid = false;
      } else if (!emailInput.value.includes('@')) {
        document.getElementById('email-error').textContent = 'Please enter a valid email';
        isValid = false;
      }

      if (!passwordInput.value) {
        document.getElementById('password-error').textContent = 'Password is required';
        isValid = false;
      }

      return isValid;
    }

    // 显示提示消息
    function showAlert(message, type) {
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      window.scrollTo(0, 0);
    }

    // 处理表单提交
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // 登录
        const { data, error } = await window.supabase_client.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw new Error(error.message);
        }

        // 保存邮箱（如果用户选择了"记住我"）
        if (rememberInput.checked) {
          localStorage.setItem('scriptbridge_saved_email', email);
        } else {
          localStorage.removeItem('scriptbridge_saved_email');
        }

        // 登录成功
        showAlert('Sign in successful! Redirecting to dashboard...', 'success');

        // 2 秒后重定向到个人主页
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);

      } catch (error) {
        showAlert('Sign in failed: ' + error.message, 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
