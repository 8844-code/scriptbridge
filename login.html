<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=20260510">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>

  <style>
    .page-wrapper {
      position: relative;
    }

    .page-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 77, 46, 0.08), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(61, 107, 79, 0.1), transparent 35%);
      pointer-events: none;
    }

    .auth-container {
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 22px;
      padding: 36px 30px 28px;
      box-shadow: 0 14px 36px rgba(26, 26, 26, 0.08);
      backdrop-filter: blur(4px);
    }

    :root.theme-dark .auth-card {
      background: #0f172a !important;
      border-color: rgba(248, 250, 252, 0.28) !important;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42) !important;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    :root.theme-dark .login-header h1,
    :root.theme-dark .login-header p,
    :root.theme-dark .form-group label,
    :root.theme-dark .remember-me,
    :root.theme-dark .switch-link {
      color: #f8fafc !important;
    }

    .login-header p {
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group input {
      border-radius: 12px;
      border: 1px solid rgba(26, 26, 26, 0.14);
      background: rgba(255, 255, 255, 0.84);
    }

    :root.theme-dark .form-group input {
      background: #1e293b !important;
      border-color: rgba(248, 250, 252, 0.32) !important;
      color: #f8fafc !important;
    }

    :root.theme-dark .form-group input::placeholder {
      color: rgba(248, 250, 252, 0.72) !important;
    }

    .form-group input:focus {
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }

    .remember-row {
      margin-top: -2px;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--ink);
    }

    .remember-me input[type="checkbox"] {
      width: auto;
      margin: 0;
      accent-color: var(--sage);
    }

    .btn-primary {
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(140deg, #2f5a40 0%, #3d6b4f 100%);
      box-shadow: 0 10px 18px rgba(61, 107, 79, 0.24);
    }

    .btn-primary:hover {
      background: linear-gradient(140deg, #2a5139 0%, #365f46 100%);
      transform: translateY(-1px);
    }

    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .switch-link a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 26, 0.3);
      transition: all 0.2s;
      font-weight: 600;
    }

    .switch-link a:hover {
      color: var(--coral);
      border-bottom-color: var(--coral);
    }

    :root.theme-dark .switch-link a {
      color: #f8fafc !important;
      border-bottom-color: rgba(248, 250, 252, 0.62) !important;
    }

    @media (max-width: 768px) {
      .auth-card {
        padding: 24px 16px 18px;
      }

      .login-header h1 {
        font-size: 28px;
      }
    }

    @media (max-width: 480px) {
      .auth-container {
        max-width: 100%;
      }

      .login-header {
        margin-bottom: 20px;
      }

      .login-header h1 {
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .remember-row {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark" aria-hidden="true"><img src="images/scriptbridge-mark.svg" alt=""></div>
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button class="active" onclick="setLang('en')">EN</button>
        <button onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </nav>

  <!-- 主页面 -->
  <div class="page-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        <div class="login-header">
          <h1><span class="en-only">Sign In</span><span class="zh-only">登录</span></h1>
          <p><span class="en-only">Welcome back to ScriptBridge</span><span class="zh-only">欢迎回到 ScriptBridge</span></p>
        </div>

        <div id="alert-container"></div>

        <form id="login-form">
          <!-- 邮箱 -->
          <div class="form-group">
            <label for="email"><span class="en-only">Email Address</span><span class="zh-only">邮箱</span></label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
            <div class="form-error" id="email-error"></div>
          </div>

          <!-- 密码 -->
          <div class="form-group">
            <label for="password"><span class="en-only">Password</span><span class="zh-only">密码</span></label>
            <input type="password" id="password" name="password" required placeholder="Your password">
            <div class="form-error" id="password-error"></div>
            <p style="text-align:right; margin-top: 6px; font-size: 13px;">
              <a href="forgot-password.html" class="en-only" style="color: var(--muted); text-decoration: underline;">Forgot password?</a>
              <a href="forgot-password.html" class="zh-only" style="color: var(--muted); text-decoration: underline;">忘记密码？</a>
            </p>
          </div>

          <!-- 记住我 -->
          <div class="form-group remember-row">
            <label class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <span class="en-only">Remember me</span>
              <span class="zh-only">记住我</span>
            </label>
          </div>

          <!-- 提交按钮 -->
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span id="btn-text"><span class="en-only">Sign In</span><span class="zh-only">登录</span></span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="switch-link">
          <span class="en-only">New to ScriptBridge? <a href="signup.html">Create account</a></span>
          <span class="zh-only">还没有账户？<a href="signup.html">立即注册</a></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 初始化 Supabase -->
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // 语言切换
    function setLang(lang) {
      document.body.classList.toggle('zh', lang === 'zh');
      document.querySelectorAll('.lang-pill button').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && lang === 'en') || (i === 1 && lang === 'zh'));
      });
      localStorage.setItem('scriptbridge_lang', lang);
    }

    // 初始化语言
    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('scriptbridge_lang') || 'en';
      setLang(savedLang);
    });

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberInput = document.getElementById('remember');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertContainer = document.getElementById('alert-container');

    // 加载保存的邮箱（如果用户之前选择了"记住我"）
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('scriptbridge_saved_email');
      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberInput.checked = true;
      }
    });

    // 表单验证
    function validateForm() {
      let isValid = true;
      const isZh = document.body.classList.contains('zh');

      document.getElementById('email-error').textContent = '';
      document.getElementById('password-error').textContent = '';

      if (!emailInput.value) {
        document.getElementById('email-error').textContent = isZh ? '请输入邮箱' : 'Email is required';
        isValid = false;
      } else if (!emailInput.value.includes('@')) {
        document.getElementById('email-error').textContent = isZh ? '请输入有效邮箱' : 'Please enter a valid email';
        isValid = false;
      }

      if (!passwordInput.value) {
        document.getElementById('password-error').textContent = isZh ? '请输入密码' : 'Password is required';
        isValid = false;
      }

      return isValid;
    }

    // 显示提示消息
    function showAlert(message, type) {
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      window.scrollTo(0, 0);
    }

    // 处理表单提交
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // 登录
        const { data, error } = await window.supabase_client.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw new Error(error.message);
        }

        // 保存邮箱（如果用户选择了"记住我"）
        if (rememberInput.checked) {
          localStorage.setItem('scriptbridge_saved_email', email);
        } else {
          localStorage.removeItem('scriptbridge_saved_email');
        }

        // 登录成功
        showAlert(document.body.classList.contains('zh') ? '登录成功！正在跳转到个人主页...' : 'Sign in successful! Redirecting to dashboard...', 'success');

        // 2 秒后重定向到个人主页
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);

      } catch (error) {
        showAlert((document.body.classList.contains('zh') ? '登录失败：' : 'Sign in failed: ') + error.message, 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
