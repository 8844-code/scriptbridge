<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Marketplace — 剧桥 · ScriptBridge</title>
  <link rel="icon" type="image/svg+xml" href="images/scriptbridge-mark.svg?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <script src="js/theme.js" defer></script>
  <script src="js/nav-mobile.js" defer></script>

  <style>
    .browse-wrapper {
      min-height: 100vh;
      padding: 100px 40px 80px;
      position: relative;
    }

    .browse-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 77, 46, 0.07), transparent 35%),
        radial-gradient(circle at 92% 88%, rgba(61, 107, 79, 0.09), transparent 35%);
      pointer-events: none;
    }

    .browse-container {
      max-width: 1180px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .browse-header {
      margin-bottom: 22px;
    }

    .browse-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .browse-header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 15px;
    }

    .filters-card {
      background: rgba(253, 250, 244, 0.92);
      border: 1px solid rgba(26, 26, 26, 0.12);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px rgba(26, 26, 26, 0.06);
      display: grid;
      gap: 12px;
      grid-template-columns: 1.6fr 1fr 1fr 0.8fr 0.8fr;
    }

    .filters-card input,
    .filters-card select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(26, 26, 26, 0.14);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      color: var(--ink);
      font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
    }

    .filters-card input:focus,
    .filters-card select:focus {
      outline: none;
      border-color: rgba(61, 107, 79, 0.65);
      box-shadow: 0 0 0 3px rgba(61, 107, 79, 0.15);
    }

    .scripts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .script-card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 18px;
      text-decoration: none;
      color: var(--ink);
      transition: all 0.2s;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .script-card--clickable {
      cursor: pointer;
    }

    .script-card:hover {
      border-color: var(--coral);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 77, 46, 0.18);
    }

    .script-card-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      min-height: 48px;
    }

    .script-card-author {
      font-size: 14px;
      color: var(--muted);
    }

    .script-card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .script-type-pill {
      display: inline-block;
      background: rgba(61, 107, 79, 0.1);
      color: var(--sage);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .script-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .script-date {
      margin-top: auto;
      font-size: 13px;
      color: var(--muted);
    }

    #nav-auth-slot {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      background: rgba(253, 250, 244, 0.92);
      border: 1px dashed rgba(26, 26, 26, 0.2);
      border-radius: 18px;
      padding: 36px 20px;
      margin-top: 6px;
    }

    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      padding: 30px 0;
    }

    @media (max-width: 860px) {
      .filters-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .browse-wrapper {
        padding: 80px 20px 60px;
      }

      .browse-header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <img class="nav-logo-mark" src="images/scriptbridge-mark.svg?v=2" alt="" width="40" height="40" decoding="async">
      <div class="nav-logo-text-wrap">
        <span class="nav-logo-zh">剧桥</span>
        <span class="nav-logo-en">ScriptBridge</span>
      </div>
    </a>
    <div class="nav-right">
      <div class="lang-pill">
        <button id="lang-en" type="button">EN</button>
        <button id="lang-zh" type="button">中文</button>
      </div>
      <a href="index.html" class="btn btn-outline" id="home-link">
        <span class="en-only">Home</span>
        <span class="zh-only">首页</span>
      </a>
      <div id="nav-auth-slot"></div>
    </div>
  </nav>

  <main class="browse-wrapper">
    <div class="browse-container">
      <header class="browse-header">
        <h1 id="page-title">Browse Marketplace</h1>
        <p id="page-subtitle">Discover published scripts. Sign in to view full details.</p>
      </header>

      <section class="filters-card">
        <input type="text" id="search-input" placeholder="Search by script title...">

        <select id="type-filter">
          <option value="all" id="type-all-option">All Types</option>
          <option value="短剧剧本">短剧剧本</option>
          <option value="电影剧本">电影剧本</option>
          <option value="小说IP">小说IP</option>
        </select>

        <select id="sort-select">
          <option value="latest" id="sort-latest-option">Latest</option>
          <option value="price_asc" id="sort-asc-option">Price: Low to High</option>
          <option value="price_desc" id="sort-desc-option">Price: High to Low</option>
        </select>
        <input type="number" id="price-min" placeholder="Min price" min="0">
        <input type="number" id="price-max" placeholder="Max price" min="0">
      </section>

      <div id="loading-state" class="loading-state">
        <span class="spinner"></span>
        <span id="loading-text">Loading scripts...</span>
      </div>

      <section id="scripts-grid" class="scripts-grid" style="display: none;"></section>
      <section id="empty-state" class="empty-state" style="display: none;"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    const searchInput = document.getElementById('search-input');
    const typeFilter = document.getElementById('type-filter');
    const sortSelect = document.getElementById('sort-select');
    const priceMinInput = document.getElementById('price-min');
    const priceMaxInput = document.getElementById('price-max');
    const loadingState = document.getElementById('loading-state');
    const scriptsGrid = document.getElementById('scripts-grid');
    const emptyState = document.getElementById('empty-state');
    const langEnBtn = document.getElementById('lang-en');
    const langZhBtn = document.getElementById('lang-zh');
    const navAuthSlot = document.getElementById('nav-auth-slot');

    window._isLoggedIn = false;
    let allScripts = [];
    let authorMap = {};
    let currentLang = localStorage.getItem('scriptbridge_lang') || 'en';
    const i18n = {
      en: {
        pageTitle: 'Browse Marketplace',
        pageSubtitle: 'Discover published scripts on the marketplace. Full details open after launch.',
        searchPh: 'Search by script title...',
        typeAll: 'All Types',
        sortLatest: 'Latest',
        sortAsc: 'Price: Low to High',
        sortDesc: 'Price: High to Low',
        priceMinPh: 'Min price',
        priceMaxPh: 'Max price',
        loading: 'Loading scripts...',
        empty: 'No scripts match your filters.',
        emptyMarket: 'No scripts available yet. Check back soon.',
        unknownAuthor: 'Unknown author',
        untitled: 'Untitled Script',
        by: 'By ',
        uploaded: 'Uploaded: ',
        failed: 'Failed to load scripts: ',
        waitlistPrompt: 'Full script pages are not open to the public yet. Join the waitlist on the homepage to get early access?'
      },
      zh: {
        pageTitle: '浏览市场',
        pageSubtitle: '浏览已上架作品目录。完整详情将在正式开放后提供。',
        searchPh: '按标题搜索作品...',
        typeAll: '全部类型',
        sortLatest: '最新发布',
        sortAsc: '价格：从低到高',
        sortDesc: '价格：从高到低',
        priceMinPh: '最低价',
        priceMaxPh: '最高价',
        loading: '正在加载中...',
        empty: '没有符合筛选条件的作品。',
        emptyMarket: '暂无上架作品，敬请期待。',
        unknownAuthor: '未知作者',
        untitled: '未命名作品',
        by: '作者：',
        uploaded: '上传时间：',
        failed: '加载失败：',
        waitlistPrompt: '作品详情页暂未对公众开放。是否前往首页加入候补名单？'
      }
    };

    function t(key) {
      return i18n[currentLang][key];
    }

    function updateNavAuth() {
      if (window._isLoggedIn) {
        navAuthSlot.innerHTML =
          '<a href="dashboard.html" class="btn btn-outline en-only">Dashboard</a>' +
          '<a href="dashboard.html" class="btn btn-outline zh-only">个人主页</a>';
      } else {
        navAuthSlot.innerHTML =
          '<a href="index.html#signup" class="btn btn-outline en-only">Join Waitlist</a>' +
          '<a href="index.html#signup" class="btn btn-outline zh-only">加入候补</a>';
      }
    }

    function setLang(lang) {
      currentLang = lang === 'zh' ? 'zh' : 'en';
      document.body.classList.toggle('zh', currentLang === 'zh');
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      langEnBtn.classList.toggle('active', currentLang === 'en');
      langZhBtn.classList.toggle('active', currentLang === 'zh');
      localStorage.setItem('scriptbridge_lang', currentLang);
      document.title = currentLang === 'zh' ? '浏览市场 — 剧桥 · ScriptBridge' : 'Browse Marketplace — 剧桥 · ScriptBridge';
      document.getElementById('page-title').textContent = t('pageTitle');
      document.getElementById('page-subtitle').textContent = t('pageSubtitle');
      searchInput.placeholder = t('searchPh');
      document.getElementById('type-all-option').textContent = t('typeAll');
      document.getElementById('sort-latest-option').textContent = t('sortLatest');
      document.getElementById('sort-asc-option').textContent = t('sortAsc');
      document.getElementById('sort-desc-option').textContent = t('sortDesc');
      priceMinInput.placeholder = t('priceMinPh');
      priceMaxInput.placeholder = t('priceMaxPh');
      document.getElementById('loading-text').textContent = t('loading');
      updateNavAuth();
      if (allScripts.length) applyFilters();
    }

    function formatDate(isoString) {
      if (!isoString) return '—';
      return new Date(isoString).toLocaleDateString();
    }

    function formatPrice(price) {
      return '¥ ' + Number(price || 0).toFixed(2);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadAuthors(userIds) {
      if (!userIds.length) return;
      const { data, error } = await window.supabase_client
        .from('users')
        .select('user_id, full_name, email')
        .in('user_id', userIds);

      if (error) {
        console.warn('Failed to load user names:', error.message);
        return;
      }

      authorMap = {};
      (data || []).forEach((user) => {
        authorMap[user.user_id] = user.full_name || user.email || t('unknownAuthor');
      });
    }

    async function loadScripts() {
      const { data, error } = await window.supabase_client
        .from('scripts')
        .select('*')
        .eq('status', 'published')
        .order('created_at', { ascending: false });

      if (error) throw error;

      allScripts = data || [];
      const userIds = [...new Set(allScripts.map((item) => item.user_id).filter(Boolean))];
      await loadAuthors(userIds);
    }

    function applyFilters() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedType = typeFilter.value;
      const sortValue = sortSelect.value;
      const minPrice = parseFloat(priceMinInput.value) || 0;
      const maxPrice = parseFloat(priceMaxInput.value) || Infinity;

      let list = allScripts.filter((item) => {
        const title = (item.title || '').toLowerCase();
        const byTitle = !keyword || title.includes(keyword);
        const byType = selectedType === 'all' || item.script_type === selectedType;
        return byTitle && byType;
      });

      list = list.filter((item) => {
        const price = parseFloat(item.price) || 0;
        return price >= minPrice && price <= maxPrice;
      });

      list.sort((a, b) => {
        if (sortValue === 'price_asc') return Number(a.price || 0) - Number(b.price || 0);
        if (sortValue === 'price_desc') return Number(b.price || 0) - Number(a.price || 0);
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });

      renderScripts(list);
    }

    function setEmptyStateMessage(noPublished) {
      if (noPublished) {
        emptyState.innerHTML =
          '<span class="en-only">' + escapeHtml(i18n.en.emptyMarket) + '</span>' +
          '<span class="zh-only">' + escapeHtml(i18n.zh.emptyMarket) + '</span>';
      } else {
        emptyState.textContent = t('empty');
      }
    }

    function renderScripts(list) {
      if (!list.length) {
        scriptsGrid.style.display = 'none';
        emptyState.style.display = 'block';
        setEmptyStateMessage(!allScripts.length);
        return;
      }

      const html = list.map((item) => {
        const author = authorMap[item.user_id] || t('unknownAuthor');
        return (
          '<div class="script-card script-card--clickable" tabindex="0" role="link" data-script-id="' + escapeHtml(item.id) + '">' +
            '<div class="script-card-title">' + escapeHtml(item.title || t('untitled')) + '</div>' +
            '<div class="script-card-author">' + t('by') + escapeHtml(author) + '</div>' +
            '<div class="script-card-row">' +
              '<span class="script-type-pill">' + escapeHtml(item.script_type || '—') + '</span>' +
              '<span class="script-price">' + formatPrice(item.price) + '</span>' +
            '</div>' +
            '<div class="script-date">' + t('uploaded') + formatDate(item.created_at) + '</div>' +
          '</div>'
        );
      }).join('');

      scriptsGrid.innerHTML = html;
      scriptsGrid.style.display = 'grid';
      emptyState.style.display = 'none';
    }

    function openCardFromEvent(e) {
      const card = e.target.closest('.script-card');
      if (!card) return;
      const id = card.getAttribute('data-script-id');
      if (!id) return;
      if (!window._isLoggedIn) {
        if (window.confirm(t('waitlistPrompt'))) {
          window.location.href = 'index.html#signup';
        }
        return;
      }
      window.location.href = 'script-detail.html?id=' + encodeURIComponent(id);
    }

    async function initPage() {
      try {
        const { data: { session } } = await window.supabase_client.auth.getSession();
        window._isLoggedIn = !!(session && session.user);
        setLang(currentLang);
        await loadScripts();
        loadingState.style.display = 'none';
        applyFilters();
      } catch (error) {
        loadingState.innerHTML = t('failed') + escapeHtml(error.message);
      }
    }

    scriptsGrid.addEventListener('click', openCardFromEvent);
    scriptsGrid.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.script-card');
      if (!card) return;
      e.preventDefault();
      const id = card.getAttribute('data-script-id');
      if (!id) return;
      if (!window._isLoggedIn) {
        if (window.confirm(t('waitlistPrompt'))) {
          window.location.href = 'index.html#signup';
        }
        return;
      }
      window.location.href = 'script-detail.html?id=' + encodeURIComponent(id);
    });

    searchInput.addEventListener('input', applyFilters);
    typeFilter.addEventListener('change', applyFilters);
    sortSelect.addEventListener('change', applyFilters);
    priceMinInput.addEventListener('input', applyFilters);
    priceMaxInput.addEventListener('input', applyFilters);
    langEnBtn.addEventListener('click', () => setLang('en'));
    langZhBtn.addEventListener('click', () => setLang('zh'));

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
